# This presence config defines activity that will be shown when player is
# playing chess.
#
# Author: Herman S. <dreamscache.d@gmail.com>
# Since: v0.4.0

[Presence]
Condition = event_label == "mas_chess"
Priority = -20
Dynamic = True
Inherit = Default


[Activity]
Details = [set_his_her1()] [moni_nickname_cleanup()] играет в шахматы с [set_his_her2()]


