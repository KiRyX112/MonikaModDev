# This presence config defines activity that will be shown when player is
# playing piano.
#
# Author: Herman S. <dreamscache.d@gmail.com>
# Since: v0.4.0

[Presence]
Condition = event_label == "mas_piano"
Priority = -20
Dynamic = True
Inherit = Default


[Activity]
Details = [set_his_her1()] [moni_nickname_cleanup()] слушает, как [set_his_her4()] играет на пианино для неё

