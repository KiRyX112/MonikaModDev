# This presence config defines activity that will be shown when player is
# playing pong.
#
# Author: Herman S. <dreamscache.d@gmail.com>
# Since: v0.4.0

[Presence]
Condition = event_label == "mas_pong"
Priority = -20
Dynamic = True
Inherit = Default


[Activity]
Details = [set_his_her1()] [moni_nickname_cleanup()] играет в пинг-понг вместе с [set_his_her2()]

